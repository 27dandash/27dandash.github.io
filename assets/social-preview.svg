<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Abdelrahman Dandash — Flutter Developer</title>
  <desc id="desc">Production Flutter applications, selected work, and case studies across Android and iOS.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#08110f"/>
      <stop offset="1" stop-color="#101d19"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#b8f36e" stop-opacity=".3"/>
      <stop offset="1" stop-color="#b8f36e" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="46" height="46" patternUnits="userSpaceOnUse">
      <path d="M46 0H0V46" fill="none" stroke="#dff2e8" stroke-opacity=".07"/>
    </pattern>
    <clipPath id="screenLeft"><rect x="778" y="190" width="120" height="260" rx="22"/></clipPath>
    <clipPath id="screenCenter"><rect x="891" y="144" width="136" height="294" rx="24"/></clipPath>
    <clipPath id="screenRight"><rect x="1007" y="192" width="120" height="260" rx="22"/></clipPath>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="24" stdDeviation="18" flood-color="#000" flood-opacity=".42"/>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <circle cx="953" cy="305" r="315" fill="url(#glow)"/>
  <path d="M0 0h1200v630H0z" fill="none" stroke="#dff2e8" stroke-opacity=".14" stroke-width="2"/>

  <g transform="translate(70 68)">
    <rect width="54" height="54" rx="15" fill="#b8f36e"/>
    <text x="27" y="34" text-anchor="middle" fill="#142106" font-family="Arial, sans-serif" font-size="18" font-weight="800">AD</text>
    <text x="72" y="20" fill="#f0f6f1" font-family="Arial, sans-serif" font-size="18" font-weight="700">Abdelrahman Dandash</text>
    <text x="72" y="45" fill="#9baaa2" font-family="Arial, sans-serif" font-size="14">Flutter Developer</text>
  </g>

  <text x="70" y="186" fill="#b8f36e" font-family="Arial, sans-serif" font-size="16" font-weight="700" letter-spacing="4">PRODUCTION FLUTTER · ANDROID + IOS</text>
  <text x="70" y="253" fill="#f0f6f1" font-family="Arial, sans-serif" font-size="54" font-weight="700">Mobile products built for</text>
  <text x="70" y="316" fill="#b8f36e" font-family="Arial, sans-serif" font-size="54" font-weight="700">real-world delivery.</text>
  <text x="70" y="366" fill="#9baaa2" font-family="Arial, sans-serif" font-size="20">Selected production work and Flutter case studies.</text>

  <g transform="translate(70 440)" font-family="Arial, sans-serif">
    <rect width="174" height="78" rx="16" fill="#13231e" stroke="#dff2e8" stroke-opacity=".14"/>
    <text x="22" y="34" fill="#f0f6f1" font-size="24" font-weight="700">16</text>
    <text x="22" y="58" fill="#9baaa2" font-size="13">Shipped products</text>
    <rect x="190" width="196" height="78" rx="16" fill="#13231e" stroke="#dff2e8" stroke-opacity=".14"/>
    <text x="212" y="34" fill="#f0f6f1" font-size="24" font-weight="700">37</text>
    <text x="212" y="58" fill="#9baaa2" font-size="13">Live store listings</text>
    <rect x="402" width="194" height="78" rx="16" fill="#13231e" stroke="#dff2e8" stroke-opacity=".14"/>
    <text x="424" y="34" fill="#f0f6f1" font-size="20" font-weight="700">Android + iOS</text>
    <text x="424" y="58" fill="#9baaa2" font-size="13">Production delivery</text>
  </g>

  <g filter="url(#shadow)">
    <g transform="rotate(-7 838 320)">
      <rect x="766" y="174" width="144" height="292" rx="30" fill="#050806" stroke="#f0f6f1" stroke-opacity=".35" stroke-width="2"/>
      <image href="apps/2days-2.jpg" x="778" y="190" width="120" height="260" preserveAspectRatio="xMidYMid slice" clip-path="url(#screenLeft)"/>
    </g>
    <g>
      <rect x="878" y="128" width="162" height="326" rx="34" fill="#050806" stroke="#f0f6f1" stroke-opacity=".45" stroke-width="2"/>
      <image href="apps/familysufrah-2.jpg" x="891" y="144" width="136" height="294" preserveAspectRatio="xMidYMid slice" clip-path="url(#screenCenter)"/>
    </g>
    <g transform="rotate(7 1067 320)">
      <rect x="995" y="174" width="144" height="292" rx="30" fill="#050806" stroke="#f0f6f1" stroke-opacity=".35" stroke-width="2"/>
      <image href="apps/athathe-2.jpg" x="1007" y="192" width="120" height="260" preserveAspectRatio="xMidYMid slice" clip-path="url(#screenRight)"/>
    </g>
  </g>
</svg>
